name: release

# 打 v* 标签就自动构建并发布 Release：
#   便携版 tar.gz / zip（自带 Qt）、deb、校验和
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libssl-dev libssh2-1-dev libgl1-mesa-dev zip

      - name: 安装 Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: 单元测试
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build-test -j"$(nproc)"
          cd build-test && ctest --output-on-failure

      - name: 构建并打包
        run: QT_DIR="$QT_ROOT_DIR" ./packaging/make-release.sh

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/termdock-*-linux-x86_64.tar.gz
            dist/termdock-*-linux-x86_64.zip
            dist/termdock_*_amd64.deb
            dist/SHA256SUMS
            dist/MD5SUMS
            dist/RELEASE_NOTES.md

  # Windows 版走 MSYS2 UCRT64：和本地验证过的工具链一致（gcc + Qt6 + libssh2 + OpenSSL）
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libssh2
            mingw-w64-ucrt-x86_64-openssl

      - name: 单元测试
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX"
          cmake --build build-test
          cd build-test && ./termdock-tests.exe

      - name: 构建并打包
        run: ./packaging/make-release-windows.sh

      - name: 冒烟测试（自检必须在打包产物里跑通）
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/termdock-*-windows-x64.zip" -DestinationPath smoke -Force
          $exe = Get-ChildItem -Path smoke -Recurse -Filter termdock.exe | Select-Object -First 1
          if (-not $exe) { throw "打包产物里没有 termdock.exe" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $out = & $exe.FullName --selftest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "打包产物自检失败（exit=$LASTEXITCODE）" }
          if ($out -notmatch "结果：(\d+)/(\d+) 通过，0 失败") { throw "自检有失败项" }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/termdock-*-windows-x64.zip
            dist/SHA256SUMS-windows
            dist/MD5SUMS-windows
            dist/RELEASE_NOTES-WINDOWS.md

  # 发布要等两个平台都产出，否则先跑的会把后跑的产物冲掉
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 取回各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 合并发布说明
        run: |
          {
            cat dist/RELEASE_NOTES.md
            echo
            cat dist/RELEASE_NOTES-WINDOWS.md
          } > dist/RELEASE_NOTES-ALL.md
          cat dist/RELEASE_NOTES-ALL.md

      # 同名 tag 重新发布时（比如改完代码重新打标签），先把旧附件删掉，
      # 否则会留下上一版文件名的文件（如 0.2.2 的包挂在 0.2.3 的 Release 下）
      - name: 清掉同名 tag 下的旧附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}" \
                  --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            echo "删除旧附件 $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
          done

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: termdock ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES-ALL.md
          draft: false
          prerelease: false
          files: |
            dist/termdock-*-linux-x86_64.tar.gz
            dist/termdock-*-linux-x86_64.zip
            dist/termdock_*_amd64.deb
            dist/termdock-*-windows-x64.zip
            dist/SHA256SUMS
            dist/MD5SUMS
            dist/SHA256SUMS-windows
            dist/MD5SUMS-windows

      # 只保留最新的 1 个 Release（连同它的 tag），旧版本连 tag 一起删掉，
      # 免得 Releases 页面挂一串没人下载的历史版本
      - name: 清理旧 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=1
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName" > old.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "删除旧版本 $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < old.txt
          rm -f old.txt
